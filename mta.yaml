_schema-version: 3.3.0
ID: capProject
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
- name: capProject-srv
  type: java
  path: srv
  properties:
    JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
    JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    SPRING_PROFILES_ACTIVE: cloud,sandbox
  requires:
  - name: capProject-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: sap_java_buildpack_jakarta
    instances: 1
  build-parameters:
    build-result: target/*-exec.jar
    builder: custom
    commands:
    - mvn clean package -DskipTests=true --batch-mode
- name: capProject-db-deployer
  type: hdb
  path: db
  requires:
  - name: capProject-db
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: custom
    commands:
    - npm run build
- name: capProject-destination-content
  type: com.sap.application.content
  requires:
  - name: capProject-destination-service
    parameters:
      content-target: true
  - name: capProject_html_repo_host
    parameters:
      service-key:
        name: capProject_html_repo_host-key
  - name: uaa_capProject
    parameters:
      service-key:
        name: uaa_capProject-key
  parameters:
    content:
      instance:
        destinations:
        - Name: cds_approuter_capProject_html_repo_host
          ServiceInstanceName: capProject-html5-app-host-service
          ServiceKeyName: capProject_html_repo_host-key
          sap.cloud.service: cds_approuter
        - Authentication: OAuth2UserTokenExchange
          Name: cds_approuter_uaa_capProject
          ServiceInstanceName: capProject-xsuaa-service
          ServiceKeyName: uaa_capProject-key
          sap.cloud.service: cds_approuter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: capProject-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: capProject_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - author.zip
      name: author
      target-path: resources/
- name: author
  type: html5
  path: app/author
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: capProject-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: capProject-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: capProject-destination-service
    service-plan: lite
- name: capProject_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: capProject-html5-app-host-service
    service-plan: app-host
- name: uaa_capProject
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: capProject-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
